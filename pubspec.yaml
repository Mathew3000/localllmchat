name: local_llm_chat
description: LoomChat — a Flutter app to chat with locally hosted LLMs via OpenAI-compatible API.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.1
  shared_preferences: ^2.2.2
  provider: ^6.1.2
  uuid: ^4.3.3
  crypto: ^3.0.3
  flutter_markdown: ^0.6.22
  markdown: ^7.0.0
  intl: ^0.19.0
  file_picker: ^8.1.3
  image_picker: ^1.1.0
  cryptography: ^2.7.0
  url_launcher: ^6.3.2
  web_socket_channel: ^3.0.1
  qr_flutter: ^4.1.0
  path: ^1.9.0
  pasteboard: ^0.5.0
  package_info_plus: ^9.0.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "icon.png"
  min_sdk_android: 21
  adaptive_icon_foreground: "icon.png"
  adaptive_icon_background: "#ffffff"

flutter:
  uses-material-design: true
