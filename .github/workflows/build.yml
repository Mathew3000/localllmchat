name: Build

# Every push to master builds a signed Android APK and a Windows zip and
# publishes both as a GitHub Release. The LoomChat server reads the latest
# release and offers the APK to the app as an update. Pull requests are only
# analyzed.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same Flutter version as local builds, so analyzer results match.
  FLUTTER_VERSION: "3.41.6"
  # Number of releases to keep; older ones are deleted.
  KEEP_RELEASES: 10

jobs:
  android:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the build number is the number of commits.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Version
        id: version
        run: |
          BUILD=$(git rev-list --count HEAD)
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION+$BUILD"

      # In-app updates only install when every APK is signed with the same
      # key, so the build fails instead of producing an unsigned update.
      - name: Signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          cat > android/key.properties <<PROPS
          storeFile=$RUNNER_TEMP/release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - name: Build APK
        if: github.event_name != 'pull_request'
        run: |
          flutter build apk --release \
            --build-name="${{ steps.version.outputs.version }}" \
            --build-number="${{ steps.version.outputs.build }}"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "LoomChat-${{ steps.version.outputs.version }}-build.${{ steps.version.outputs.build }}.apk"

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: android
          path: LoomChat-*.apk
          retention-days: 3

  windows:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Build
        shell: bash
        run: |
          BUILD=$(git rev-list --count HEAD)
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          echo "NAME=LoomChat-$VERSION-build.$BUILD-windows" >> "$GITHUB_ENV"
          flutter pub get
          flutter build windows --release --build-name="$VERSION" --build-number="$BUILD"

      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "$env:NAME.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: LoomChat-*-windows.zip
          retention-days: 3

  release:
    needs: [android, windows]
    # Publish the Android update even if only the Windows build failed.
    if: >-
      always() && github.event_name != 'pull_request' &&
      needs.android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.android.outputs.version }}
          BUILD: ${{ needs.android.outputs.build }}
        run: |
          ls -la dist
          git log -1 --format=%B > notes.txt
          if [ "${{ needs.windows.result }}" != "success" ]; then
            printf '\n_Windows build failed for this release._\n' >> notes.txt
          fi
          gh release create "v$VERSION-build.$BUILD" dist/* \
            --target "$GITHUB_SHA" \
            --title "LoomChat $VERSION (build $BUILD)" \
            --notes-file notes.txt \
            --latest

      - name: Delete old releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 200 --json tagName,createdAt \
            --jq "sort_by(.createdAt) | reverse | .[$KEEP_RELEASES:] | .[].tagName" |
          while read -r tag; do
            gh release delete "$tag" --yes --cleanup-tag
          done
