image: ghcr.io/cirruslabs/flutter:stable

# Cache pub packages between jobs to speed up builds.
cache:
  key: "$CI_COMMIT_REF_SLUG-pub"
  paths:
    - .pub-cache/

variables:
  PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"

stages:
  - validate
  - build
  - release

# ── Analyze ────────────────────────────────────────────────────────────────────

analyze:
  stage: validate
  script:
    - flutter pub get
    - flutter analyze --fatal-infos
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ── Build APK (branch commits) ────────────────────────────────────────────────

build:apk:
  stage: build
  script:
    - flutter pub get
    - flutter build apk --release
  artifacts:
    name: "localllmchat-${CI_COMMIT_SHORT_SHA}"
    paths:
      - build/app/outputs/flutter-apk/app-release.apk
    expire_in: 30 days
  rules:
    # Branch pushes only — version tags are handled by build:release-apk below.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ── Release: build tagged APK ─────────────────────────────────────────────────
#
# Triggered by any tag matching vMAJOR.MINOR.PATCH (e.g. v1.2.0).
#
# Steps:
#   1. Stamp lib/version.dart with the tag so the in-app string matches.
#   2. Build with --build-name / --build-number overrides so pubspec.yaml
#      does not need to be committed with every release.

build:release-apk:
  stage: build
  script:
    # Strip the leading 'v' for Flutter's semver build-name (e.g. "1.2.0").
    - VERSION="${CI_COMMIT_TAG#v}"
    # Write version.dart — CI_COMMIT_TAG keeps the 'v' prefix for the display string.
    - |
      cat > lib/version.dart <<EOF
      /// Auto-generated by CI from tag ${CI_COMMIT_TAG}. Do not edit by hand.
      const String kAppVersion = '${CI_COMMIT_TAG} (build 1)';
      EOF
    - flutter pub get
    - flutter build apk --release --build-name="$VERSION" --build-number=1
  artifacts:
    name: "LocalLLMChat-${CI_COMMIT_TAG}"
    paths:
      - build/app/outputs/flutter-apk/app-release.apk
    # Keep release artifacts indefinitely so the download link never expires.
    expire_in: never
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

# ── Release: create GitLab release page ───────────────────────────────────────
#
# Calls the GitLab Releases API directly via curl + jq.
# CI_API_V4_URL, CI_PROJECT_ID, and CI_JOB_TOKEN are predefined variables
# that always resolve to the correct self-hosted instance — no extra config
# needed, and no dependency on release-cli / glab host detection.
#
# The APK download link points to the build:release-apk job artifact using
# the stable /jobs/artifacts/<tag>/raw/…?job= URL format, so it stays valid
# as long as the artifact exists (expire_in: never above).

create-release:
  stage: release
  image: alpine:latest
  needs:
    - job: build:release-apk
      # No need to download the artifact here; we link to it by URL instead.
      artifacts: false
  script:
    - apk add --no-cache curl jq
    - |
      jq -n \
        --arg name "LocalLLMChat ${CI_COMMIT_TAG}" \
        --arg tag  "${CI_COMMIT_TAG}" \
        --arg desc "## LocalLLMChat ${CI_COMMIT_TAG}\n\n### Install\n1. Download **LocalLLMChat-${CI_COMMIT_TAG}.apk** below.\n2. Transfer to your Android device and open it.\n3. Enable *Install from unknown sources* if prompted." \
        --arg url  "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/build/app/outputs/flutter-apk/app-release.apk?job=build:release-apk" \
        --arg link "LocalLLMChat-${CI_COMMIT_TAG}.apk" \
        '{
          name: $name,
          tag_name: $tag,
          description: $desc,
          assets: { links: [{ name: $link, url: $url, link_type: "package" }] }
        }' \
      | curl --fail-with-body \
          --request POST \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --header "Content-Type: application/json" \
          --data @- \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
