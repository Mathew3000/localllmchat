image: ghcr.io/cirruslabs/flutter:stable

# Cache pub packages between jobs to speed up builds.
cache:
  key: "$CI_COMMIT_REF_SLUG-pub"
  paths:
    - .pub-cache/

variables:
  PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"
  # Full history: the build number is the number of commits on the branch.
  GIT_DEPTH: "0"

stages:
  - validate
  - build
  - release

# ── Linux desktop dependencies ────────────────────────────────────────────────
#
# The cirruslabs Flutter image is Ubuntu-based but ships only Android tooling.
# Flutter Linux desktop needs clang, cmake, ninja, pkg-config, and GTK 3 dev
# headers.  Defined as a YAML anchor so both Linux jobs share the same list.

.linux-deps: &linux-deps
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends
        clang cmake ninja-build pkg-config
        libgtk-3-dev libblkid-dev liblzma-dev

# ── Analyze ────────────────────────────────────────────────────────────────────

analyze:
  stage: validate
  script:
    - flutter pub get
    - flutter analyze --fatal-infos
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ── Android signing + build number ──────────────────────────────────────────
#
# In-app updates only install when every APK is signed with the same key.
# Set these masked CI/CD variables (Settings → CI/CD → Variables):
#   ANDROID_KEYSTORE_BASE64   base64 of the keystore file
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# BUILD_NUMBER = commit count, so every master commit gets a higher number.

.android-build: &android-build
  before_script:
    - |
      if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
        echo "ANDROID_KEYSTORE_BASE64 is not set - refusing to build an unsigned update" >&2
        exit 1
      fi
    - echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$CI_PROJECT_DIR/release.keystore"
    - |
      cat > android/key.properties <<EOF
      storeFile=$CI_PROJECT_DIR/release.keystore
      storePassword=$ANDROID_KEYSTORE_PASSWORD
      keyAlias=$ANDROID_KEY_ALIAS
      keyPassword=$ANDROID_KEY_PASSWORD
      EOF
    - |
      export BUILD_NUMBER=$(git rev-list --count HEAD)
      export VERSION_NAME=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
      if [ -n "$CI_COMMIT_TAG" ]; then VERSION_NAME="${CI_COMMIT_TAG#v}"; fi
    - echo "Building $VERSION_NAME+$BUILD_NUMBER"

# ── Build APK (branch commits) ────────────────────────────────────────────────

build:apk:
  stage: build
  <<: *android-build
  script:
    - flutter pub get
    - flutter build apk --release --build-name="$VERSION_NAME" --build-number="$BUILD_NUMBER"
    # Read by the LoomChat server to offer the update to the app.
    - |
      NOTES=$(printf '%s' "$CI_COMMIT_TITLE" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g')
      printf '{"version":"%s","build":%s,"commit":"%s","notes":"%s"}\n' \
        "$VERSION_NAME" "$BUILD_NUMBER" "$CI_COMMIT_SHORT_SHA" "$NOTES" > update.json
    - cat update.json
  artifacts:
    name: "localllmchat-apk-${CI_COMMIT_SHORT_SHA}"
    paths:
      - build/app/outputs/flutter-apk/app-release.apk
      - update.json
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ── Build Linux (branch commits) ─────────────────────────────────────────────

build:linux:
  stage: build
  <<: *linux-deps
  script:
    - flutter pub get
    - flutter build linux --release
    - tar -czf loomchat-linux.tar.gz -C build/linux/x64/release bundle
  artifacts:
    name: "localllmchat-linux-${CI_COMMIT_SHORT_SHA}"
    paths:
      - loomchat-linux.tar.gz
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ── Release: build tagged APK ──────────────────────────────────────────────
#
# Triggered by any tag matching vMAJOR.MINOR.PATCH (e.g. v1.2.0). The version
# name comes from the tag; the build number is the commit count as usual.

build:release-apk:
  stage: build
  <<: *android-build
  script:
    - flutter pub get
    - flutter build apk --release --build-name="$VERSION_NAME" --build-number="$BUILD_NUMBER"
  artifacts:
    name: "LocalLLMChat-${CI_COMMIT_TAG}-apk"
    paths:
      - build/app/outputs/flutter-apk/app-release.apk
    expire_in: never
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

# ── Release: build tagged Linux bundle ────────────────────────────────────────

build:release-linux:
  stage: build
  <<: *linux-deps
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - flutter pub get
    - flutter build linux --release --build-name="$VERSION" --build-number=$(git rev-list --count HEAD)
    - tar -czf LoomChat-linux.tar.gz -C build/linux/x64/release bundle
  artifacts:
    name: "LocalLLMChat-${CI_COMMIT_TAG}-linux"
    paths:
      - LoomChat-linux.tar.gz
    expire_in: never
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

# ── Release: create GitLab release page ───────────────────────────────────────
#
# Calls the GitLab Releases API directly via curl + jq.
# CI_API_V4_URL, CI_PROJECT_ID, and CI_JOB_TOKEN are predefined variables
# that always resolve to the correct self-hosted instance — no extra config
# needed, and no dependency on release-cli / glab host detection.

create-release:
  stage: release
  image: alpine:latest
  needs:
    - job: build:release-apk
      artifacts: false
    - job: build:release-linux
      artifacts: false
  script:
    - apk add --no-cache curl jq
    - |
      jq -n \
        --arg name "LocalLLMChat ${CI_COMMIT_TAG}" \
        --arg tag  "${CI_COMMIT_TAG}" \
        --arg desc "## LocalLLMChat ${CI_COMMIT_TAG}\n\n### Android\nDownload **LocalLLMChat-${CI_COMMIT_TAG}.apk** and install it on your device.\nEnable *Install from unknown sources* if prompted.\n\n### Linux\nDownload **LoomChat-${CI_COMMIT_TAG}-linux.tar.gz**, extract, and run \`bundle/local_llm_chat\`." \
        --arg apk_url  "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/build/app/outputs/flutter-apk/app-release.apk?job=build:release-apk" \
        --arg apk_name "LocalLLMChat-${CI_COMMIT_TAG}.apk" \
        --arg linux_url  "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/LoomChat-linux.tar.gz?job=build:release-linux" \
        --arg linux_name "LoomChat-${CI_COMMIT_TAG}-linux.tar.gz" \
        '{
          name: $name,
          tag_name: $tag,
          description: $desc,
          assets: {
            links: [
              { name: $apk_name,   url: $apk_url,   link_type: "package" },
              { name: $linux_name, url: $linux_url, link_type: "package" }
            ]
          }
        }' \
      | curl --fail-with-body \
          --request POST \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --header "Content-Type: application/json" \
          --data @- \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
