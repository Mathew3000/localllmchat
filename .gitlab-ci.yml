image: ghcr.io/cirruslabs/flutter:stable

# Cache pub packages between jobs to speed up builds.
cache:
  key: "$CI_COMMIT_REF_SLUG-pub"
  paths:
    - .pub-cache/

variables:
  PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"

stages:
  - validate
  - build

# ── Analyze ────────────────────────────────────────────────────────────────────

analyze:
  stage: validate
  script:
    - flutter pub get
    - flutter analyze --fatal-infos
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ── Build APK ─────────────────────────────────────────────────────────────────

build:apk:
  stage: build
  script:
    - flutter pub get
    - flutter build apk --release
  artifacts:
    name: "localllmchat-${CI_COMMIT_SHORT_SHA}"
    paths:
      - build/app/outputs/flutter-apk/app-release.apk
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
