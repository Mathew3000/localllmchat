services:

  # ── Reverse proxy — TLS termination ──────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certs live one level up (generated by ../generate_cert.sh).
      # Run from the repo root:  ./generate_cert.sh <your-LAN-ip>
      - ../certs:/etc/certs:ro
    depends_on:
      - backend

  # ── LocalLLMChat backend ──────────────────────────────────────────────────
  backend:
    build: .
    restart: unless-stopped
    env_file: .env          # copy .env.example → .env and fill in SECRET_KEY
    volumes:
      - backend-data:/data  # SQLite database
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  backend-data:
